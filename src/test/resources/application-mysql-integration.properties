spring.config.import=
spring.datasource.url=${MYSQL_INTEGRATION_DB_URL}
spring.datasource.username=${MYSQL_INTEGRATION_DB_USERNAME}
spring.datasource.password=${MYSQL_INTEGRATION_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
