spring.flyway.enabled=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate

# H2 in-memory for local test runs
spring.datasource.url=jdbc:h2:mem:valor_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.platform=h2

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Test profile must never call the external payment provider.
razorpay.key-id=rzp_test_offline
razorpay.key-secret=offline-test-secret
razorpay.webhook-secret=offline-test-webhook-secret
razorpay.mode=test
razorpay.offline-test-mode=true

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
