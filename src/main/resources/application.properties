spring.application.name=valor-backend
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
server.port=${PORT:8081}
spring.flyway.enabled=true
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.valor.service.SmsServiceImpl=INFO
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/valor_world_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
dev.bootstrap.enabled=${DEV_BOOTSTRAP_ENABLED:false}
dev.bootstrap.super-admin-email=${DEV_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
dev.bootstrap.super-admin-password=${DEV_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
dev.seed.sample-data-enabled=${DEV_SEED_SAMPLE_DATA_ENABLED:false}
dev.seed.sample-password=${DEV_SEED_SAMPLE_PASSWORD:}

# CORS: comma-separated origins. Native clients do not send an Origin header.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:8090}

# OTP configuration
otp.validity-minutes=5
otp.max-attempts=3
otp.lock-minutes=15
otp.resend-cooldown-seconds=10
otp.hourly-limit=20
otp.retention-days=7

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Razorpay Test Mode credentials; keep secrets in environment only.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
