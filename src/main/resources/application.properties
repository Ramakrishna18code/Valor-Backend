spring.application.name=valor-backend
server.port=${PORT:8080}
spring.flyway.enabled=false
logging.level.com.valor.service.SmsServiceImpl=INFO

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/valor_lift_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT configuration
jwt.secret=${JWT_SECRET:local-development-secret-change-me-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS: comma-separated origins. Native clients do not send an Origin header.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:8090}

# OTP configuration
otp.validity-minutes=5
otp.max-attempts=3
otp.lock-minutes=15
otp.resend-cooldown-seconds=10
otp.hourly-limit=20
otp.retention-days=7

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
