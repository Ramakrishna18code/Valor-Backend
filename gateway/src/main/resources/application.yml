server:
  port: ${PORT:8080}
spring:
  application:
    name: valor-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002}
                allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowedHeaders: '*'
          routes:
            - id: backend-websocket
              uri: ${BACKEND_WS_URL:ws://127.0.0.1:8081}
              predicates:
                - Path=/ws/**,/ws
            - id: backend-api
              uri: ${BACKEND_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
